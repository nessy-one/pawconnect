<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Donations - PawConnect</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* Background */
body {
  background: #F4F1E6;
}

/* Layout */
.container {
  display: flex;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  padding: 20px;
  border-right: 1px solid #ccc;
}

.logo {
  width: 185px;
  margin-bottom: 20px;
}

/* Sidebar links */
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  text-decoration: none;
  color: black;
  cursor: pointer;
}

.menu-item:hover {
  background: #ddd;
}

/* Active menu */
.menu-item.active {
  background: #AFC4D6;
}

/* Main */
.main {
  flex: 1;
  padding: 20px;
}

/* Header */
.header {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.header a {
  color: black;
  text-decoration: none;
}

.header i {
  cursor: pointer;
}

/* Card */
.card {
  background: white;
  padding: 30px;
  border-radius: 10px;
}

/* Top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Button */
.btn {
  background: #4E8DC0;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.btn:hover {
  background: #3c76a3;
}

/* Center content */
.img {
  text-align: center;
  margin-top: 40px;
}

.imgpic {
  width: 600px;
  margin-bottom: 15px;
}

</style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <img src="imgaes/userlogo.png" class="logo">

    <a href="userprof.html" class="menu-item">
      <i class="fa-regular fa-user"></i> My Account
    </a>

    <a href="addres.html" class="menu-item">
      <i class="fa-solid fa-location-dot"></i> My Addresses
    </a>

    <a href="donation.html" class="menu-item active">
      <i class="fa-solid fa-hand-holding-heart"></i> My Donations
    </a>

    <a href="report.html" class="menu-item">
      <i class="fa-solid fa-bug"></i> My Reports
    </a>

    <a href="save.html" class="menu-item">
      <i class="fa-regular fa-heart"></i> Saves
    </a>

    <a href="notifications.html" class="menu-item">
      <i class="fa-regular fa-bell"></i> Notifications
    </a>

    <a href="login.html" class="menu-item">
      <i class="fa-solid fa-right-from-bracket"></i> Log out
    </a>
  </div>

  
  <div class="main">

    
    <div class="header">
      <a href="notifications.html"><i class="fa-regular fa-bell"></i></a>
      <a href="save.html"><i class="fa-regular fa-heart"></i></a>
      <a href="userprof.html"><i class="fa-regular fa-user"></i></a>
      <span>User profile</span>
    </div>

    
    <div class="card">

      
      <div class="top-bar">
        <h2>My Donations</h2>
        <button class="btn">DONATE NOW</button>
      </div>

      
      <div class="img">
       
        <img src="imgaes/bcat.png" alt="No donations">
        <p>You will be able to see all your monetary or item donations here</p>
      </div>

    </div>

  </div>

</div>

</body>
</html>

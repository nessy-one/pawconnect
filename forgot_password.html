<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawConnect – Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

body { background:#F4F1E6; }

.container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── LEFT PANEL ── */
.image {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
}

.logo-img {
  position: absolute;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 500px;
  z-index: 2;
}

.image::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 100%, #e8d9b8 0%, transparent 70%);
  z-index: 0;
}

.pet-img {
  position: relative;
  z-index: 1;
  width: 90%;
  max-width: 700px;
  display: block;
  margin-bottom: -6px;
  object-fit: contain;
  object-position: bottom;
  filter: drop-shadow(0 -8px 24px rgba(0,0,0,0.10));
}

/* ── DIVIDER ── */
.divider {
  width: 1px;
  background: linear-gradient(to bottom, transparent 8%, #d1c9b4 30%, #d1c9b4 70%, transparent 92%);
  align-self: stretch;
  flex-shrink: 0;
}

/* ── RIGHT PANEL ── */
.form-section {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px 24px;
}

.card {
  width: 100%;
  max-width: 340px;
}

/* ── TITLE ── */
.page-title {
  font-size: 28px;
  font-weight: 700;
  color: #4E8DC0;
  margin-bottom: 8px;
  line-height: 1.2;
}

.subtitle {
  font-size: 13px;
  color: #888;
  margin-bottom: 28px;
}

/* ── LABEL ── */
.field-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #555;
  margin-bottom: 6px;
}

/* ── INPUT ── */
.input-group {
  position: relative;
  margin-bottom: 16px;
}

.input-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #cbc5b3;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  color: #333;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}

.input-group input::placeholder { color: #aaa; }

.input-group input:focus {
  border-color: #4E8DC0;
  box-shadow: 0 0 0 3px rgba(78,141,192,.12);
}

/* ── RESET BUTTON ── */
.btn {
  width: 100%;
  padding: 11px;
  background: #4E8DC0;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .06em;
  transition: background .2s, transform .1s, box-shadow .2s;
  box-shadow: 0 3px 12px rgba(78,141,192,.30);
  margin-bottom: 14px;
}

.btn:hover {
  background: #3a78ab;
  box-shadow: 0 5px 16px rgba(78,141,192,.38);
}
.btn:active { transform: scale(.985); }

/* ── CANCEL LINK ── */
.cancel-row {
  text-align: center;
}

.cancel-row a {
  font-size: 13px;
  color: #4E8DC0;
  text-decoration: none;
  font-weight: 500;
  transition: opacity .2s;
}
.cancel-row a:hover { opacity: .7; }

/* ── SUCCESS STATE (hidden by default) ── */
.success-msg {
  display: none;
  background: #eaf4ec;
  border: 1.5px solid #a8d5b0;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  color: #3a7a47;
  margin-bottom: 16px;
  text-align: center;
}

/* ── RESPONSIVE ── */
input, select { font-size: 16px !important; } /* stops iOS zoom-on-focus */

/* Tablets, foldables (unfolded portrait), small laptops: stack the panels */
@media (max-width: 900px) {
  .container { flex-direction: column; height: auto; min-height: 100dvh; overflow: visible; }
  .divider { display: none; }

  .image { flex: none; height: auto; padding: 24px 0 0; justify-content: center; overflow: visible; }
  .logo-img { position: static; transform: none; width: min(320px, 70%); max-width: none; }
  .dog-img, .pet-img { display: none; }
  .image::before { display: none; }

  .form-section { flex: none; padding: 16px 20px 40px; overflow: visible; }
  .title-img { width: min(240px, 65%); }
}

/* Phones & folded foldables */
@media (max-width: 480px) {
  .card { max-width: 100%; }
  .logo-img { width: min(240px, 75%); }
  .page-title { font-size: 24px; }
}

/* Very narrow (Galaxy Fold cover screen ~280px) */
@media (max-width: 320px) {
  .form-section { padding: 12px 12px 32px; }
  .title-img { width: 70%; }
}

/* Phones in landscape: keep side-by-side but allow scrolling */
@media (max-height: 500px) and (orientation: landscape) and (min-width: 600px) {
  .container { flex-direction: row; height: auto; min-height: 100dvh; }
  .divider { display: block; }
  .image { height: auto; min-height: 100dvh; padding: 0; }
  .logo-img { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 220px; }
  .dog-img, .pet-img { display: block; width: auto; height: 55vh; max-width: 80%; }
  .form-section { align-items: flex-start; padding: 20px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- LEFT IMAGE -->
  <div class="image">
    <img src="form-image/logo.png" class="logo-img" alt="PawConnect">
    <img src="form-image/cat1.png" class="pet-img" alt="PawConnect pet">
  </div>

  <!-- VISUAL DIVIDER -->
  <div class="divider"></div>

  <!-- FORGOT PASSWORD FORM -->
  <div class="form-section">
    <div class="card">

      <h1 class="page-title">Forgot Password?</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="success-msg" id="successMsg">
        ✓ Reset link sent! Check your inbox.
      </div>

      <!-- CONNECTED TO PHP -->
      <form action="php/forgot_password.php" method="POST" id="forgotForm">

        <label class="field-label" for="email">Email</label>
        <div class="input-group">
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn">RESET PASSWORD</button>

      </form>

      <div class="cancel-row">
        <a href="login.html"><strong>Cancel</strong></a>
      </div>

    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const msg = document.getElementById('successMsg');

  if (params.get('sent') === '1') {
    msg.textContent = '✓ If that email is registered, a reset link is on its way. Check your inbox.';
    msg.style.display = 'block';
  } else if (params.get('error') === 'invalid_email') {
    msg.textContent = 'Please enter a valid email address.';
    msg.style.cssText = 'display:block;background:#fdeeee;border-color:#e6b0b0;color:#a03030;';
  }
  if (params.has('sent') || params.has('error')) {
    history.replaceState(null, '', window.location.pathname);
  }
</script>
</body>
</html>

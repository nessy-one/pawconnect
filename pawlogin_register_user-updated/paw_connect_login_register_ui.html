<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawConnect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #F4F1E6;
}

/* LAYOUT */
.container {
  display: flex;
  height: 100vh;
}

/* IMAGE SIDE */
.image {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* IMAGE WRAPPER */
.image-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DOG IMAGE */
.dog-img {
  width: 85%;
  max-height: 90%;
  object-fit: contain;
}

/* LOGO OVERLAY */
.logo-img {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 537px;
}

/* FORM SIDE */
.form-section {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 320px;
}

/* TITLE IMAGE */
.title-img {
  display: block;
  margin: 10px auto 20px;
  width: 339px;
}

/* INPUT */
.input-group {
  margin-bottom: 12px;
}

.input-group input {
  width: 100%;
  padding: 10px;
  border: 1px solid #8A8686;
  border-radius: 6px;
}

/* PASSWORD */
.password-row {
  position: relative;
}

.password-row span {
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 12px;
  color: #8A8686;
  cursor: pointer;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 10px;
  background: #4E8DC0;
  color: white;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  cursor: pointer;
}

.btn:hover {
  background: #3c76a3;
}
.or-line {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 15px 0;
  font-size: 13px;
  color: #012224;
}

.or-line::before,
.or-line::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid #8A8686;
}

.or-line span {
  margin: 0 10px;
}

/* OR */
.or {
  text-align: center;
  margin: 15px 0;
  font-size: 13px;
  color: #012224;
}

/* SOCIAL */
.social {
  border: 1px solid #8A8686;
  border-radius: 6px;
  padding: 8px;
  text-align: center;
  margin-bottom: 8px;
  background: white;
  font-size: 13px;
  cursor: pointer;
}

/* FOOTER */
.footer {
  text-align: center;
  font-size: 13px;
  margin-top: 10px;
}

.footer a {
  color: #4E8DC0;
  text-decoration: none;
}

/* DIVIDER */
hr {
  border: none;
  height: 1px;
  background: #ccc;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .image {
    height: 40vh;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="container">

  <div class="image">
    <div class="image-wrapper">
      <img src="imgaes/Logo.png" class="logo-img" alt="Logo">
      <img src="imgaes/dog1.png" class="dog-img" alt="Dog">
    </div>
  </div>

  <div class="form-section">
    <div class="card">

      <!-- SIGN IN IMAGE -->
      <img src="imgaes/sign_in.png" class="title-img" alt="Sign In">

      <div class="input-group">
        <input type="email" placeholder="Email">
      </div>

      <div class="input-group password-row">
        <input type="password" placeholder="Password">
        <span>👁</span>
      </div>

      <button class="btn">SIGN IN</button>

      <div class="or-line">
  <span>OR</span>
</div>

      <div class="social">
  <i class="fa-brands fa-google"></i>
  Continue with Google
</div>

<div class="social">
  <i class="fa-brands fa-facebook"></i>
  Continue with Facebook
</div>

      <div class="footer">
        No account? <a href="#">Sign up</a>
      </div>

    </div>
  </div>

</div>

<hr>

<!-- REGISTER -->
<div class="container">

  <div class="image">
    <div class="image-wrapper">
      <img src="imgaes/logo.png" class="logo-img" alt="Logo">
      <img src="imgaes/dog2-removebg-preview.png" class="dog-img" alt="Dog">
    </div>
  </div>

  <div class="form-section">
    <div class="card">

      <!-- SIGN UP IMAGE -->
      <img src="imgaes/sing_up.png" class="title-img" alt="Sign Up">

      <div class="input-group">
        <input type="text" placeholder="Name">
      </div>

      <div class="input-group">
        <input type="email" placeholder="Email">
      </div>

      <div class="input-group password-row">
        <input type="password" placeholder="Password">
        <span>👁</span>
      </div>

      <button class="btn">SIGN UP</button>

      <div class="or-line">
  <span>OR</span>
</div>

      <div class="social">
  <i class="fa-brands fa-google"></i>
  Continue with Google
</div>

<div class="social">
  <i class="fa-brands fa-facebook"></i>
  Continue with Facebook
</div>

      <div class="footer">
        Already have an account? <a href="#">Sign in</a>
      </div>

    </div>
  </div>

</div>

</body>
</html>

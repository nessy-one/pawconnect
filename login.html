<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawConnect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

body { background:#F4F1E6; }

.container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── LEFT PANEL ── */
.image {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
}

.logo-img {
  position: absolute;
  top: -50px;
  left: 50%;
  max-width: 600px;
  transform: translateX(-50%);
  z-index: 2;
}
 
.dog-img {
  position: relative;
  z-index: 1;
  width: 78%;
  max-width: 480px;
  display: block;
  margin-bottom: -6px;
  object-fit: contain;
  object-position: bottom;
  filter: drop-shadow(0 -8px 24px rgba(0,0,0,0.10));
}

/* ── DIVIDER ── */
.divider {
  width: 1px;
  background: linear-gradient(to bottom, transparent 8%, #d1c9b4 30%, #d1c9b4 70%, transparent 92%);
  align-self: stretch;
  flex-shrink: 0;
}

/* ── RIGHT PANEL ── */
.form-section {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px 24px;
}

.card {
  width: 100%;
  max-width: 340px;
}

.title-img {
  display: block;
  margin: 0 auto 15px;
  width: 300px;
}

/* ── INPUTS ── */
.input-group {
  position: relative;
  margin-bottom: 12px;
}

.input-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #cbc5b3;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  color: #333;
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}

.input-group input::placeholder { color: #aaa; }

.input-group input:focus {
  border-color: #4E8DC0;
  box-shadow: 0 0 0 3px rgba(78,141,192,.12);
}

.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #888;
  font-size: 14px;
  transition: color .2s;
}
.password-toggle:hover { color: #4E8DC0; }

/* ── FORGOT PASSWORD ── */
.forgot-row {
  text-align: right;
  margin-top: -4px;
  margin-bottom: 16px;
}

.forgot-row a {
  font-size: 12px;
  color: #4E8DC0;
  text-decoration: none;
  transition: opacity .2s;
}
.forgot-row a:hover { opacity: .7; }

/* ── SIGN IN BUTTON ── */
.btn {
  width: 100%;
  padding: 11px;
  background: #4E8DC0;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .06em;
  transition: background .2s, transform .1s, box-shadow .2s;
  box-shadow: 0 3px 12px rgba(78,141,192,.30);
}

.btn:hover {
  background: #3a78ab;
  box-shadow: 0 5px 16px rgba(78,141,192,.38);
}
.btn:active { transform: scale(.985); }

/* ── OR DIVIDER ── */
.or-line {
  display: flex;
  align-items: center;
  margin: 18px 0;
  font-size: 12px;
  color: #999;
}

.or-line::before,
.or-line::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid #d5cebd;
}

.or-line span { margin: 0 12px; }

/* ── SOCIAL BUTTONS ── */
.social {
  border: 1.5px solid #cbc5b3;
  padding: 9px;
  text-align: center;
  margin-bottom: 10px;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  cursor: pointer;
  transition: background .2s, border-color .2s, box-shadow .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.social:hover {
  background: #faf8f2;
  border-color: #a8a090;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

/* Google brand colors */
.social .fa-google { color: #4285F4; }
 
/* Facebook brand color */
.social .fa-facebook { color: #1877F2; }

/* ── FOOTER ── */
.footer {
  text-align: center;
  font-size: 13px;
  color: #777;
  margin-top: 18px;
}

.footer a {
  color: #4E8DC0;
  text-decoration: none;
  font-weight: 500;
}

.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">

  <!-- LEFT IMAGE -->
  <div class="image">
    <img src="form-image/logo.png" class="logo-img" alt="PawConnect">
    <img src="form-image/dog2.png" class="dog-img" alt="Puppy">
  </div>

  <!-- VISUAL DIVIDER -->
  <div class="divider"></div>

  <!-- LOGIN FORM -->
  <div class="form-section">
    <div class="card">

      <img src="form-image/sign_in.png" class="title-img" alt="Sign in">

      <!-- CONNECTED TO PHP — form fields & names unchanged -->
      <form action="php/login.php" method="POST">

        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="Password" minlength="6" required>
          <span class="password-toggle" onclick="togglePassword('password', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot-row">
          <a href="forgot_password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn">SIGN IN</button>

      </form>

      <div class="or-line"><span>OR</span></div>

      <div class="social"><i class="fa-brands fa-google"></i> Continue with Google</div>
      <div class="social"><i class="fa-brands fa-facebook"></i> Continue with Facebook</div>

      <div class="footer">
        No account? <a href="register.html">Sign up</a>
      </div>

    </div>
  </div>
</div>

<script>
  function togglePassword(id, el) {
    const input = document.getElementById(id);
    const icon = el.querySelector("i");
    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  }

  (function () {
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (!error) return;

    const messages = {
      wrong_password: "Incorrect password. Please try again.",
      user_not_found: "No account found with that username."
    };

    const text = messages[error];
    if (!text) return;

    // Find the password input group
    const passwordGroup = document.getElementById("password").closest(".input-group");

    // Style the input border red
    document.getElementById("password").style.borderColor = "#E24B4A";

    // Create the error message element
    const msg = document.createElement("p");
    msg.textContent = text;
    msg.style.cssText = "margin:6px 0 0 2px;font-size:12px;color:#E24B4A;display:flex;align-items:center;gap:5px;";
    msg.innerHTML = `<i class="fa-solid fa-circle-exclamation" style="font-size:11px;"></i> ${text}`;

    passwordGroup.appendChild(msg);

    // Clear error styling when user starts typing
    document.getElementById("password").addEventListener("input", function () {
      this.style.borderColor = "";
      msg.remove();
      history.replaceState(null, "", window.location.pathname);
    }, { once: true });

    // Clean URL without reloading
    history.replaceState(null, "", window.location.pathname);
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body {
  background:#F4F1E6;
}

.container {
  display:flex;
  height:100vh;
}

/* LEFT IMAGE */
.image {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.image-wrapper {
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.dog-img {
  width:85%;
  max-height:90%;
  object-fit:contain;
}

.logo-img {
  position:absolute;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  width:400px;
}

/* FORM */
.form-section {
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card {
  width:340px;
}

.title-img {
  display:block;
  margin:10px auto 20px;
  width:260px;
}

.input-group {
  position:relative;
}

.input-group input {
  width:100%;
  padding:10px;
  border:1px solid #8A8686;
  border-radius:6px;
  margin-bottom:12px;
}

/* PASSWORD ICON */
.password-toggle {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#555;
}

select {
  width:100%;
  padding:10px;
  border:1px solid #8A8686;
  border-radius:6px;
  margin-bottom:12px;
}

/* BUTTON */
.btn {
  width:100%;
  padding:10px;
  background:#4E8DC0;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover {
  background:#3c74a3;
}

/* OR LINE */
.or-line {
  display:flex;
  align-items:center;
  margin:15px 0;
  font-size:13px;
}

.or-line::before,
.or-line::after {
  content:'';
  flex:1;
  border-bottom:1px solid #8A8686;
}

.or-line span {
  margin:0 10px;
}

/* SOCIAL */
.social {
  border:1px solid #8A8686;
  padding:8px;
  text-align:center;
  margin-bottom:8px;
  border-radius:6px;
  background:white;
  cursor:pointer;
  transition:0.2s;
}

.social:hover {
  background:#f0f0f0;
}

/* FOOTER */
.footer {
  text-align:center;
  font-size:13px;
  margin-top:10px;
}

.footer a {
  color:#4E8DC0;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
  <!-- LEFT SIDE -->
  <div class="image">
    <div class="image-wrapper">
      <img src="form-image/logo.png" class="logo-img">
      <img src="form-image/dog2-removebg-preview.png" class="dog-img">
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="form-section">
    <div class="card">
      <img src="form-image/sing_up.png" class="title-img">

      <form action="php/register.php" method="POST">
        <div class="input-group">
          <input type="text" name="name" placeholder="Name" required>
        </div>

        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="Password" minlength="6" required>
          <span class="password-toggle" onclick="togglePassword('password', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <div class="input-group">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" minlength="6" required>
          <span class="password-toggle" onclick="togglePassword('confirm_password', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <!-- <div class="input-group">
          <select name="role" required>
            <option value="">Select Role</option>
            <option value="pet_owner">Pet Owner</option>
            <option value="business_owner">Business Owner</option>
          </select>
        </div> -->

        <button class="btn" type="submit">SIGN UP</button>
      </form>

      <div class="or-line"><span>OR</span></div>

      <div class="social"><i class="fa-brands fa-google"></i> Continue with Google</div>
      <div class="social"><i class="fa-brands fa-facebook"></i> Continue with Facebook</div>

      <div class="footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>

    </div>
  </div>
</div>
<script>
function togglePassword(id, el) {
  const input = document.getElementById(id);
  const icon = el.querySelector("i");

  if (input.type === "password") {
    input.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}
</script>
</body>
</html>

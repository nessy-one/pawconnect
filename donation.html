<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawConnect</title>
<!-- donation.html -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body { background: #F4F1E6; }

.container { display: flex; height: 100vh; }

/* ── SIDEBAR ─────────────────────────────────────────────── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  padding: 0 16px 24px;
  border-right: 1px solid #ddd;
  background: #F4F1E6;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 0 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #ddd;
  margin-bottom: 12px;
}

.logo-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background-color: #3b8fc4;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.logo-circle img {
  width: 52px;
  height: 52px;
  object-fit: cover;
}

.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-item {
  padding: 11px 14px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #012224;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
}

.menu-item:hover { background: #e0ddd2; }
.menu-item.active { background: #AFC4D6; color: #012224; }
.menu-item i { width: 18px; text-align: center; font-size: 14px; }

.sidebar-footer {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

/* ── MAIN ─────────────────────────────────────────────────── */
.main { flex: 1; padding: 20px 28px; overflow-y: auto; }

/* ── TOPBAR ───────────────────────────────────────────────── */
.topbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
}

.topbar a {
  color: #012224;
  text-decoration: none;
  font-size: 18px;
  transition: opacity 0.15s;
}

.topbar a:hover { opacity: 0.65; }

.topbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: #012224;
}

.topbar-user .avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: #555;
  overflow: hidden;
}

.topbar-user .avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ── CARD ─────────────────────────────────────────────────── */
.card {
  background: white;
  padding: 24px;
  border-radius: 10px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.card-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: #012224;
}

.btn {
  background: #4E8DC0;
  color: white;
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s;
}

.btn:hover { background: #3a7aad; }

/* ── EMPTY STATE ──────────────────────────────────────────── */
.pic {
  text-align: center;
  margin-top: 40px;
}

.pic img {
  height: 250px;
  width: auto;
  margin-bottom: 15px;
}

.pic p {
  font-size: 13.5px;
  color: #666;
}

.confirm-popup {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.3);
  display: none; align-items: center; justify-content: center; z-index: 300;
}
.confirm-box {
  background: white; padding: 28px 36px; border-radius: 12px;
  text-align: center; min-width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.14);
  animation: pop 0.25s ease;
}
@keyframes pop {
  from { transform: scale(0.75); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.confirm-box p { font-size: 14px; color: #333; margin-bottom: 20px; }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }
.confirm-actions button {
  padding: 8px 22px; border-radius: 6px; border: none;
  font-family: 'Poppins', sans-serif; font-size: 13px; cursor: pointer;
  transition: background 0.15s;
}
.confirm-yes { background: #4E8DC0; color: white; }
.confirm-yes:hover { background: #3a7aad; }
.confirm-no  { background: #eee; color: #333; }
.confirm-no:hover  { background: #ddd; }
.logout-icon-circle {
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(78,141,192,0.15); color: #4E8DC0;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px auto; font-size: 20px;
}
</style>
</head>
<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Logo, centered, divider below -->
    <div class="sidebar-logo">
      <a href="dashboard.html">
        <div class="logo-circle">
          <img src="image/logo.png" alt="PawConnect Logo">
        </div>
      </a>
    </div>

    <!-- Nav links -->
    <div class="sidebar-nav">
      <a href="userprof.html" class="menu-item">
        <i class="fa-regular fa-user"></i> My Account
      </a>
      <a href="donation.html" class="menu-item active">
        <i class="fa-solid fa-hand-holding-heart"></i> My Donations
      </a>
      <a href="report.html" class="menu-item">
        <i class="fa-solid fa-bug"></i> Reports &amp; Feedback
      </a>
      <a href="save.html" class="menu-item">
        <i class="fa-regular fa-heart"></i> Saves
      </a>
      <a href="notifications.html" class="menu-item">
        <i class="fa-regular fa-bell"></i> Notifications
      </a>
    </div>

    <!-- Logout, pinned to bottom, divider above -->
    <div class="sidebar-footer">
      <a href="php/logout.php" class="menu-item" onclick="event.preventDefault(); confirmLogout();">
        <i class="fa-solid fa-right-from-bracket"></i> Log out
      </a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">
      <a href="notifications.html" title="Notifications"><i class="fa-regular fa-bell"></i></a>
      <a href="save.html" title="Saves"><i class="fa-regular fa-heart"></i></a>
      <div class="topbar-user">
        <div class="avatar" id="topbarAvatar">
          <i class="fa-regular fa-user" id="topbarIcon"></i>
        </div>
        <span id="topbarUsername">User</span>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="card-header">
        <h2>My Donations</h2>
        <button class="btn" onclick="window.location.href='donate.html'">DONATE NOW</button>
      </div>
      <div id="donationsSummary" style="display:none;margin-bottom:18px;font-size:13.5px;color:#555"></div>
      <div id="donationsList"></div>
      <div class="pic" id="donationsEmptyState" style="display:none">
        <img src="image/cat.png" alt="No donations">
        <p>You will be able to see all your monetary or item donations here.</p>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRM LOGOUT POPUP -->
<div id="logoutConfirmPopup" class="confirm-popup">
  <div class="confirm-box">
    <div class="logout-icon-circle"><i class="fa-solid fa-power-off"></i></div>
    <p style="font-weight:600;font-size:16px;margin-bottom:4px;">Log out of PawConnect?</p>
    <p style="color:#888;font-size:12.5px;margin-bottom:18px;">You'll need to sign back in to access your account.</p>
    <div class="confirm-actions">
      <button class="confirm-no" onclick="closeLogoutConfirm()">Cancel</button>
      <button class="confirm-yes" style="background:#4E8DC0" onclick="doLogout()">Log out</button>
    </div>
  </div>
</div>

<script>
  (async function () {
    const API = 'php/userprof.php';
    try {
      const res  = await fetch(`${API}?action=get`);
      const data = await res.json();
      if (!data.success) return;

      const u = data.user;

      const nameEl = document.getElementById('topbarUsername');
      if (nameEl) nameEl.textContent = u.username || 'User';

      const avatarEl = document.getElementById('topbarAvatar');
      if (!avatarEl) return;

      if (u.photo) {
        avatarEl.innerHTML = '';
        const img = document.createElement('img');
        img.src = u.photo;
        img.alt = 'avatar';
        img.onerror = () => {
          avatarEl.innerHTML = '<i class="fa-regular fa-user"></i>';
        };
        avatarEl.appendChild(img);
      } else {
        avatarEl.innerHTML = '<i class="fa-regular fa-user"></i>';
      }

    } catch (err) {
      console.warn('Could not sync avatar.', err);
    }
  })();

  async function loadMyDonations() {
    try {
      const res = await fetch('php/donations.php?action=list');
      const data = await res.json();
      if (!data.success) return;

      const listEl = document.getElementById('donationsList');
      const emptyEl = document.getElementById('donationsEmptyState');
      const summaryEl = document.getElementById('donationsSummary');

      if (!data.donations.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        summaryEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `Total donated: <strong>₱${data.total_donated.toLocaleString('en-US', {minimumFractionDigits:2})}</strong> across ${data.donations.length} donation${data.donations.length === 1 ? '' : 's'}`;

      listEl.innerHTML = data.donations.map(d => {
        const date = new Date(d.created_at.replace(' ', 'T')).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
        const statusColor = d.status === 'completed' ? '#3b7aad' : d.status === 'pending' ? '#c46a4e' : '#a04820';
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee">
            <div>
              <div style="font-weight:600;color:#012224">${d.purpose}${d.recurring ? ' <span style="font-weight:400;color:#888;font-size:12px">(Recurring)</span>' : ''}</div>
              <div style="font-size:12px;color:#888;margin-top:2px">${date}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:700;color:#DA8063">₱${Number(d.amount).toLocaleString('en-US', {minimumFractionDigits:2})}</div>
              <div style="font-size:11px;color:${statusColor};text-transform:capitalize">${d.status}</div>
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      console.warn('Could not load donation history.', err);
    }
  }

  loadMyDonations();
  
  // ── LOGOUT CONFIRM ────────────────────────────────────────
  function confirmLogout() {
    document.getElementById('logoutConfirmPopup').style.display = 'flex';
  }
  function closeLogoutConfirm() {
    document.getElementById('logoutConfirmPopup').style.display = 'none';
  }
  function doLogout() {
    window.location.href = 'php/logout.php';
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PawConnect</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { background:#F4F1E6; }

.container { display:flex; height:100vh; }

.image { flex:1; display:flex; justify-content:center; align-items:center; }

.image-wrapper { position:relative; display:flex; justify-content:center; align-items:center; width:100%; height:100%; }

.dog-img { width:85%; max-height:90%; object-fit:contain; }

.logo-img {
  position:absolute;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  width:500px;
}

.form-section { flex:1; display:flex; justify-content:center; align-items:center; }

.card { width:320px; }

.title-img { display:block; margin:10px auto 20px; width:300px; }

.input-group {
  position:relative;
}

.input-group input {
  width:100%;
  padding:10px;
  border:1px solid #8A8686;
  border-radius:6px;
  margin-bottom:12px;
}

/* PASSWORD ICON */
.password-toggle {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#555;
}

.btn {
  width:100%;
  padding:10px;
  background:#4E8DC0;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.or-line {
  display:flex;
  align-items:center;
  margin:15px 0;
  font-size:13px;
}

.or-line::before,
.or-line::after {
  content:'';
  flex:1;
  border-bottom:1px solid #8A8686;
}

.or-line span { margin:0 10px; }

.social {
  border:1px solid #8A8686;
  padding:8px;
  text-align:center;
  margin-bottom:8px;
  border-radius:6px;
  background:white;
}

.footer { text-align:center; font-size:13px; }

.footer a { color:#4E8DC0; text-decoration:none; }
</style>
</head>
<body>

<div class="container">

  <!-- LEFT IMAGE -->
  <div class="image">
    <div class="image-wrapper">
      <img src="form-image/logo.png" class="logo-img">
      <img src="form-image/dog1.png" class="dog-img">
    </div>
  </div>

  <!-- LOGIN FORM -->
  <div class="form-section">
    <div class="card">

      <img src="form-image/sign_in.png" class="title-img">

      <!-- CONNECTED TO PHP -->
      <form action="php/login.php" method="POST">

        <div class="input-group">
          <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="Password" minlength="6" required>
          <span class="password-toggle" onclick="togglePassword('password', this)">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>

        <button type="submit" class="btn">SIGN IN</button>

      </form>

      <div class="or-line"><span>OR</span></div>

      <div class="social"><i class="fa-brands fa-google"></i> Continue with Google</div>
      <div class="social"><i class="fa-brands fa-facebook"></i> Continue with Facebook</div>

      <div class="footer">
        No account? <a href="register.html">Sign up</a>
      </div>

    </div>
  </div>
</div>
<script>
  function togglePassword(id, el) {
    const input = document.getElementById(id);
    const icon = el.querySelector("i");

    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PawConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F4F1E6;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .header {
            background-color: #DA8063;
            display: flex;
            align-items: center;
            padding: 10px 24px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .logo-circle {
            border-radius: 50%;
            background-color: #3b8fc4;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .logo-circle img {
            width: 52px;
            height: 52px;
            object-fit: cover;
        }

        .search {
            flex: 2;
            position: relative;
            max-width: 80%;
            margin: 0 auto;
        }

        .search input {
            width: 100%;
            padding: 9px 44px 9px 18px;
            border-radius: 8px;
            border: none;
            background: #F4F1E6;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #8A8686;
            outline: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .search input::placeholder {
            color: #8A8686;
        }

        .search .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8A8686;
            font-size: 16px;
            pointer-events: none;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.15s;
        }

        .nav a:hover { 
            opacity: 0.75; 
        }

        .nav svg {
            width: 24px;
            height: 24px;
            stroke: #012224;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* SIDEBAR */
        .side {
            height: 100%;
            width: 400px;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #F4F1E6;
            overflow-x: hidden;
            padding-top: 20px;
            color: #012224;
        }
        
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <!-- Logo -->
        <div class="logo-circle">
            <img src="image/logo.png" alt="PawConnect Logo">
        </div>

        <!-- Search -->
        <div class="search">
            <input type="text" placeholder="Search">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
        </div>

        <!-- Nav -->
        <div class="nav">
            <a href="user-profile.html" title="Profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a href="adopt.html" title="Favourites">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
            <a href="notifications.html" title="Notifications">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </a>
        </div>
    </div>

    <div class="side">
    </div>
</body>
</html>

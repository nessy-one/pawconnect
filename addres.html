<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Addresses</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }

  body { background:#F4F1E6; }

  .container { display:flex; height:100vh; }

  /* ── SIDEBAR ─────────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    padding: 24px 16px;
    border-right: 1px solid #ddd;
    background: #F4F1E6;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .logo-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background-color: #3b8fc4;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 20px;
    flex-shrink: 0;
  }

  .logo-circle img {
    width: 52px;
    height: 52px;
    object-fit: cover;
  }

  .menu-item {
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: #012224;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
  }

  .menu-item:hover { background: #e0ddd2; }
  .menu-item.active { background: #AFC4D6; color: #012224; }
  .menu-item i { width: 18px; text-align: center; font-size: 14px; }

  .sidebar-divider {
    height: 1px;
    background: #ddd;
    margin: 8px 0;
  }

  /* ── MAIN ─────────────────────────────────────────────────── */
  .main { flex:1; padding: 20px 28px; overflow-y:auto; }

  /* Top navigation bar (bell, heart, user) */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
  }

  .topbar a {
    color: #012224;
    text-decoration: none;
    font-size: 18px;
    transition: opacity 0.15s;
  }

  .topbar a:hover { opacity: 0.65; }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    color: #012224;
  }

  .topbar-user .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #555;
    overflow: hidden;
  }

  .topbar-user .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ── CARD ─────────────────────────────────────────────────── */
  .card {
    background: white;
    padding: 24px;
    border-radius: 10px;
  }

  /* Card header: title left, button right */
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .card-header h2 {
    font-size: 18px;
    font-weight: 600;
    color: #012224;
  }

  .btn {
    background: #4E8DC0;
    color: white;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
  }

  .btn:hover { background: #3a7aad; }

  /* ── ADDRESS CARDS ────────────────────────────────────────── */
  .address {
    border: 1px solid #ccc;
    padding: 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .address.default {
    border: 2px solid #4E8DC0;
    background: #eef6fc;
  }

  .address-info { flex: 1; min-width: 0; }

  .address-info p {
    font-size: 13.5px;
    line-height: 1.65;
    color: #222;
  }

  .default-tag {
    display: none;
    color: white;
    background: #4E8DC0;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 6px;
  }

  .address.default .default-tag { display: inline-block; }

  /* Actions column */
  .actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  .top-actions {
    display: flex;
    gap: 12px;
    font-size: 12px;
  }

  .edit-btn, .delete-btn {
    color: #4E8DC0;
    cursor: pointer;
    text-decoration: underline;
  }

  .edit-btn:hover, .delete-btn:hover { opacity: 0.7; }

  .default-btn {
    background: #e4e4e4;
    padding: 5px 12px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Poppins', sans-serif;
    white-space: nowrap;
    color: #444;
  }

  .default-btn.active {
    background: #4E8DC0;
    color: white;
  }

  /* ── MODALS ───────────────────────────────────────────────── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: white;
    border-radius: 10px;
    padding: 24px;
    width: 420px;
    max-width: 90vw;
  }

  .modal h3 { margin-bottom: 16px; font-size: 16px; }

  .modal-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .modal-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
  }

  .modal-row input:focus {
    outline: none;
    border-color: #4E8DC0;
  }

  .modal-btns {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 4px;
  }

  .btn-cancel {
    background: #ddd;
    color: #333;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }

  .btn-save {
    background: #4E8DC0;
    color: white;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }

  /* Delete Confirm */
  .confirm-modal {
    background: white;
    border-radius: 10px;
    padding: 24px;
    width: 300px;
    text-align: center;
  }

  .confirm-modal p { margin-bottom: 20px; font-size: 15px; }

  .confirm-btns {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .btn-yes {
    background: #e74c3c;
    color: white;
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }

  .btn-no {
    background: #ddd;
    color: #333;
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
</style>
</head>

<body>
<div class="container">
  <div class="sidebar">
    <a href="dashboard.html">
      <div class="logo-circle">
        <img src="image/logo.png" alt="PawConnect Logo">
      </div>
    </a>

    <a href="userprof.html" class="menu-item">
      <i class="fa-regular fa-user"></i> My Account
    </a>
    <a href="addres.html" class="menu-item active">
      <i class="fa-solid fa-location-dot"></i> My Addresses
    </a>
    <a href="donation.html" class="menu-item">
      <i class="fa-solid fa-hand-holding-heart"></i> My Donations
    </a>
    <a href="report.html" class="menu-item">
      <i class="fa-solid fa-bug"></i> My Reports
    </a>
    <!-- <a href="reservations.html" class="menu-item">
      <i class="fa-regular fa-calendar-check"></i> Reservations
    </a> -->
    <a href="save.html" class="menu-item">
      <i class="fa-regular fa-heart"></i> Saves
    </a>
    <a href="notifications.html" class="menu-item">
      <i class="fa-regular fa-bell"></i> Notifications
    </a>

    <div class="sidebar-divider"></div>

    <a href="login.html" class="menu-item">
      <i class="fa-solid fa-right-from-bracket"></i> Log out
    </a>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Top navigation bar -->
    <div class="topbar">
      <a href="notifications.html" title="Notifications"><i class="fa-regular fa-bell"></i></a>
      <a href="save.html" title="Saves"><i class="fa-regular fa-heart"></i></a>
      <div class="topbar-user">
        <div class="avatar"><i class="fa-regular fa-user"></i></div>
        <span>User</span>
      </div>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-header">
        <h2>My Addresses</h2>
        <button class="btn" onclick="openAddModal()">+ ADD ADDRESS</button>
      </div>

      <div id="addressList"></div>
    </div>

  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="addEditModal">
  <div class="modal">
    <h3 id="modalTitle">Add Address</h3>
    <div class="modal-row">
      <input type="text" id="fieldName" placeholder="Full Name">
      <input type="text" id="fieldPhone" placeholder="Phone e.g. (+63) 123 456 7890">
    </div>
    <div class="modal-row">
      <input type="text" id="fieldUnit" placeholder="Unit/House No. & Street">
    </div>
    <div class="modal-row">
      <input type="text" id="fieldBarangay" placeholder="Barangay">
      <input type="text" id="fieldCity" placeholder="City">
    </div>
    <div class="modal-row">
      <input type="text" id="fieldProvince" placeholder="Province">
      <input type="text" id="fieldZip" placeholder="ZIP Code">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('addEditModal')">Cancel</button>
      <button class="btn-save" onclick="saveAddress()">Save</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-backdrop" id="deleteModal">
  <div class="confirm-modal">
    <p>Delete address?</p>
    <div class="confirm-btns">
      <button class="btn-yes" onclick="confirmDelete()">Yes</button>
      <button class="btn-no" onclick="closeModal('deleteModal')">Cancel</button>
    </div>
  </div>
</div>

<script>
  let addresses = [
    { id: 1, name: 'User', phone: '(+63) 123 456 7890', unit: 'Unit/House No. 6 Street', barangay: 'Barangay', city: 'Angeles City', province: 'Pampanga', zip: '2009' },
    { id: 2, name: 'User', phone: '(+63) 123 456 7890', unit: 'Unit/House No. 6 Street', barangay: 'Barangay', city: 'Angeles City', province: 'Pampanga', zip: '2009' }
  ];

  let defaultId = localStorage.getItem('defaultAddress')
    ? parseInt(localStorage.getItem('defaultAddress'))
    : (addresses[0]?.id || null);

  let nextId = 3;
  let editingId = null;
  let deletingId = null;

  function render() {
    const list = document.getElementById('addressList');
    list.innerHTML = '';

    if (addresses.length === 0) {
      list.innerHTML = '<p style="color:#888;font-size:14px;margin-top:10px;">No addresses yet. Click + ADD ADDRESS to add one.</p>';
      return;
    }

    addresses.forEach(addr => {
      const isDefault = addr.id === defaultId;
      const div = document.createElement('div');
      div.className = 'address' + (isDefault ? ' default' : '');
      div.id = 'addr' + addr.id;
      div.innerHTML = `
        <div class="address-info">
          <p><strong>${addr.name}</strong> | ${addr.phone}</p>
          <p>${addr.unit}</p>
          <p>${addr.barangay}, ${addr.city}, ${addr.province}, ${addr.zip}</p>
          <div class="default-tag">Default</div>
        </div>
        <div class="actions">
          <div class="top-actions">
            <span class="edit-btn" onclick="openEditModal(${addr.id})">Edit</span>
            <span class="delete-btn" onclick="openDeleteModal(${addr.id})">Delete</span>
          </div>
          <button class="default-btn ${isDefault ? 'active' : ''}" onclick="setDefault(${addr.id})">
            ${isDefault ? 'Default' : 'Set as Default'}
          </button>
        </div>`;
      list.appendChild(div);
    });
  }

  function setDefault(id) {
    defaultId = id;
    localStorage.setItem('defaultAddress', id);
    render();
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Address';
    ['Name','Phone','Unit','Barangay','City','Province','Zip'].forEach(f => {
      document.getElementById('field' + f).value = '';
    });
    document.getElementById('addEditModal').classList.add('show');
  }

  function openEditModal(id) {
    editingId = id;
    const addr = addresses.find(a => a.id === id);
    document.getElementById('modalTitle').textContent = 'Edit Address';
    document.getElementById('fieldName').value = addr.name;
    document.getElementById('fieldPhone').value = addr.phone;
    document.getElementById('fieldUnit').value = addr.unit;
    document.getElementById('fieldBarangay').value = addr.barangay;
    document.getElementById('fieldCity').value = addr.city;
    document.getElementById('fieldProvince').value = addr.province;
    document.getElementById('fieldZip').value = addr.zip;
    document.getElementById('addEditModal').classList.add('show');
  }

  function saveAddress() {
    const name = document.getElementById('fieldName').value.trim();
    const phone = document.getElementById('fieldPhone').value.trim();
    const unit = document.getElementById('fieldUnit').value.trim();
    const barangay = document.getElementById('fieldBarangay').value.trim();
    const city = document.getElementById('fieldCity').value.trim();
    const province = document.getElementById('fieldProvince').value.trim();
    const zip = document.getElementById('fieldZip').value.trim();

    if (!name || !unit || !city) {
      alert('Please fill in at least Name, Street, and City.');
      return;
    }

    if (editingId) {
      const addr = addresses.find(a => a.id === editingId);
      Object.assign(addr, { name, phone, unit, barangay, city, province, zip });
    } else {
      const newAddr = { id: nextId++, name, phone, unit, barangay, city, province, zip };
      addresses.push(newAddr);
      if (addresses.length === 1) {
        defaultId = newAddr.id;
        localStorage.setItem('defaultAddress', defaultId);
      }
    }

    closeModal('addEditModal');
    render();
  }

  function openDeleteModal(id) {
    deletingId = id;
    document.getElementById('deleteModal').classList.add('show');
  }

  function confirmDelete() {
    addresses = addresses.filter(a => a.id !== deletingId);
    if (defaultId === deletingId) {
      defaultId = addresses[0]?.id || null;
      if (defaultId) localStorage.setItem('defaultAddress', defaultId);
      else localStorage.removeItem('defaultAddress');
    }
    deletingId = null;
    closeModal('deleteModal');
    render();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  document.querySelectorAll('.modal-backdrop').forEach(m => {
    m.addEventListener('click', e => {
      if (e.target === m) m.classList.remove('show');
    });
  });

  render();
</script>

</body>
</html>

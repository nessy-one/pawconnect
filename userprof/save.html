<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saves</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* Page bg */
body {
  background: #F4F1E6;
}

/* sidebar contents */
.container {
  display: flex;
  height: 100vh;
}
.sidebar{
    width:220px;
    padding:20px;
    border-right:1px solid #ccc;
}
.logo{
    width:185px;
    margin-bottom:20px;
}

/* menu items */
.menu-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Active menu */
.menu-item.active {
  background: #AFC4D6;
}

/* Hover */
.menu-item:hover {
  background: #ddd;
}

.menu-item {
  text-decoration: none;
  color: black;
}

.main{
    flex:1;padding:20px;
}

.header{
    display:flex;
    justify-content:flex-end;
    gap:15px;margin-bottom:20px;
}
.header a{
    color:black;
    text-decoration:none;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
}

.pets{
    display:flex;
    gap:20px;margin-top:20px;
}

.pet{
  width:150px;
  border:1px solid #ccc;
  border-radius:8px;
  overflow:hidden;
  position: relative;
}

.pet img {
  width: 100%;
  height: 160px;       
  object-fit: cover;   
  object-position: center; 
  display: block;
}

.pet p{
    text-align:center;
    font-size:12px;
    padding:5px;
}

.pet-info {
  display: inline-block;
  background: #6FA8DC;
  color: white;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  margin: 5px 10px;
}

.heart {
  position: absolute;
  right: 10px;
  bottom: 10px;
  font-size: 20px;
  color: black;
  cursor: pointer;
  z-index: 10; 
}
</style>
</head>

<body>
<div class="container">

 <div class="sidebar">
    <img src="imgaes/userlogo.png" class="logo">

    <a href="userprof.html" class="menu-item">
      <i class="fa-regular fa-user"></i> My Account
    </a>

    <a href="addres.html" class="menu-item">
      <i class="fa-solid fa-location-dot"></i> My Addresses
    </a>

    <a href="donation.html" class="menu-item ">
      <i class="fa-solid fa-hand-holding-heart"></i> My Donations
    </a>

    <a href="report.html" class="menu-item ">
      <i class="fa-solid fa-bug"></i> My Reports
    </a>

    <a href="save.html" class="menu-item active">
      <i class="fa-regular fa-heart"></i> Saves
    </a>

    <a href="notifications.html" class="menu-item">
      <i class="fa-regular fa-bell"></i> Notifications
    </a>

    <a href="login.html" class="menu-item">
      <i class="fa-solid fa-right-from-bracket"></i> Log out
    </a>
  </div>

<div class="main">

<div class="header">
  <a href="notifications.html"><i class="fa-regular fa-bell"></i></a>
  <a href="save.html"><i class="fa-regular fa-heart"></i></a>
  <a href="userprof.html"><i class="fa-regular fa-user"></i></a>
  <span>User profile</span>
</div>

<div class="main">

<div class="card">
  <h2>Saves</h2>

  <div class="pets">
    <div class="pet">
      <img src="imgaes/2.png">
      <div class="pet-name">Thor</div>
      <div class="pet-info">Male, 7 yrs old</div>
      <i class="fa-regular fa-heart heart"></i>
    </div>

    <div class="pet">
      <img src="imgaes/3.png">
      <div class="pet-name">Ezra</div>
      <div class="pet-info">Female, 2 yrs old</div>
      <i class="fa-regular fa-heart heart"></i>
    </div>
  </div>

</div>

</div>
</div>
</body>
</html>

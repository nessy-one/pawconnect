<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: 
            border-box; 
        }
        
        body { 
            background-color: #F4F1E6; 
            min-height: 100vh; 
            font-family: 'Poppins', sans-serif; 
        }
        
        .header { 
            background-color: #DA8063; 
            display: flex; 
            align-items: center; 
            padding: 10px 24px; 
            gap: 16px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.12); 
        }
        
        .logo-circle { 
            border-radius: 50%; 
            background-color: #3b8fc4; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            overflow: hidden; 
            width: 52px; 
            height: 52px; 
        }
        
        .logo-circle img { 
            width: 52px; 
            height: 52px; 
            object-fit: cover; 
        }
        
        .search { 
            flex: 2; 
            position: relative; 
            max-width: 80%; 
            margin: 0 auto; 
        }
        
        .search input { 
            width: 100%; 
            padding: 9px 44px 9px 18px; 
            border-radius: 8px; 
            border: none; 
            background: #F4F1E6; 
            font-family: 'Poppins', sans-serif; 
            font-size: 14px; 
            color: #8A8686; 
            outline: none; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); 
        }
        
        .search input::placeholder { color: #8A8686; }
        
        .search .search-icon { 
            position: absolute; 
            right: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            pointer-events: none; 
        }
        
        .nav { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-left: auto; 
        }
        
        .nav a { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            transition: opacity 0.15s; 
        }
        
        .nav a:hover { opacity: 0.75; }
        
        .nav svg { 
            width: 24px; 
            height: 24px; 
            stroke: #012224; 
            fill: none; 
            stroke-width: 2; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
        }
        
        .page-body { 
            display: flex; 
            height: calc(100vh - 72px); 
            overflow: hidden; 
        }
        
        .side { 
            width: 300px; 
            flex-shrink: 0; 
            background-color: #F4F1E6; 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
            border-right: 1px solid #e0ddd0; 
        }
        
        .filters { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            padding: 12px 12px 8px; 
            border-bottom: 1px solid #e0ddd0; 
        }
        
        .chip { 
            padding: 4px 12px; 
            border-radius: 20px; 
            border: 1px solid #ccc; 
            font-size: 12px; 
            font-family: 'Poppins', sans-serif; 
            color: #444; 
            background: white; 
            cursor: pointer; 
            transition: background 0.15s, color 0.15s; 
        }
        
        .chip.active { 
            background: #4E8DC0; 
            color: white; 
            border-color: #4E8DC0; 
        }
        
        .nearby-header { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 12px 6px; 
        }
        
        .nearby-header span { 
            font-size: 13px; 
            font-weight: 600; 
            color: #012224; 
        }
        
        .station-card { 
            padding: 10px 12px; 
            border-bottom: 1px solid #e0ddd0; 
            cursor: pointer; 
            transition: background 0.15s; 
        }
        
        .station-card:hover { background: #ece9d8; }
        
        .station-card-top { 
            display: flex; 
            align-items: flex-start; 
            justify-content: space-between; 
            gap: 6px; 
        }
        
        .station-name { 
            font-size: 12px; 
            font-weight: 600; 
            color: #012224; 
            line-height: 1.4; 
            flex: 1; 
        }
        
        .info-btn { 
            width: 20px; 
            height: 20px; 
            border-radius: 50%; 
            border: 1.5px solid #4E8DC0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            cursor: pointer; 
            background: white; 
            color: #4E8DC0; 
            font-size: 11px; 
            font-weight: 600; 
            margin-top: 2px; 
        }
        
        .station-meta { 
            margin-top: 4px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            flex-wrap: wrap; 
        }
        
        .status-open { 
            font-size: 10px; 
            font-weight: 600; 
            color: #1D9E75; 
            background: #e1f5ee; 
            padding: 1px 6px; 
            border-radius: 10px; 
        }
        
        .status-closed { 
            font-size: 10px; 
            font-weight: 600; 
            color: #C0392B; 
            background: #fcebeb; 
            padding: 1px 6px; 
            border-radius: 10px; 
        }
        
        .meta-text { font-size: 10px; color: #888; }
        
        .station-desc { 
            font-size: 10px; 
            color: #888; 
            margin-top: 3px; 
            font-style: italic; 
        }
        
        .map-wrapper { 
            flex: 1; 
            position: relative; 
            overflow: hidden; 
        }
        
        .map-wrapper iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block; 
        }
        
        .popup-overlay { 
            display: none; 
            position: absolute; 
            top: 60px; 
            left: 20px; 
            z-index: 50; 
        }
        
        .popup-overlay.visible { display: block; }
        
        .popup-card { 
            background: white; 
            border-radius: 10px; 
            padding: 16px; 
            width: 260px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.18); 
            position: relative; 
        }
        
        .popup-close { 
            position: absolute; 
            top: 10px; 
            right: 12px; 
            background: none; 
            border: none; 
            font-size: 18px; 
            color: #888; 
            cursor: pointer; 
            line-height: 1; 
        }
        
        .popup-close:hover { color: #333; }
        
        .popup-name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #012224; 
            margin-bottom: 10px; 
            padding-right: 20px; 
            line-height: 1.4; 
        }
        
        .popup-detail { 
            display: flex; 
            align-items: flex-start; 
            gap: 8px; 
            font-size: 11px; 
            color: #555; 
            margin-bottom: 6px; 
        }
        
        .popup-detail svg { 
            width: 13px; 
            height: 13px; 
            stroke: #888; 
            fill: none; 
            stroke-width: 2; 
            stroke-linecap: round; 
            stroke-linejoin: round; 
            flex-shrink: 0; 
            margin-top: 1px; 
        }
        
        .popup-status-open { 
            color: #1D9E75; 
            font-weight: 600; 
            font-size: 11px; 
        }
        
        .popup-status-closed { 
            color: #C0392B; 
            font-weight: 600; 
            font-size: 11px; 
        }
        
        .popup-divider { 
            border: none; 
            border-top: 1px solid #eee; 
            margin: 10px 0; 
        }
        
        .directions-btn { 
            width: 100%; 
            padding: 9px; 
            background: #4E8DC0; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-family: 'Poppins', sans-serif; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: background 0.15s; 
        }
        
        .directions-btn:hover { background: #3a7aad; }
        
        .loading-msg { 
            font-size: 12px; 
            color: #888; 
            padding: 16px 12px; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="dashboard.html">
            <div class="logo-circle">
                <img src="image/logo.png" alt="PawConnect Logo">
            </div>
        </a>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search facilities..." oninput="filterCards()">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
        </div>
        <div class="nav">
            <a href="userprof.html" title="Profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a href="save.html" title="Favourites">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
            <a href="notifications.html" title="Notifications">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </a>
        </div>
    </div>

    <!-- PAGE BODY -->
    <div class="page-body">
        <div class="side">
            <!-- Filter chips -->
            <div class="filters">
                <div class="chip active" data-type="All">All</div>
                <div class="chip" data-type="Clinic">Clinic</div>
                <div class="chip" data-type="Shelter">Shelters</div>
                <div class="chip" data-type="Grooming">Grooming</div>
                <div class="chip" data-type="Shop">Shops</div>
                <div class="chip" data-type="Boarding">Boarding</div>
                <div class="chip" data-type="Other">Other</div>
            </div>

            <div class="nearby-header">
                <span>Nearby stations</span>
            </div>

            <div id="station-list">
                <div class="loading-msg">Locating you…</div>
            </div>
        </div>

        <!-- MAP + POPUP -->
        <div class="map-wrapper">
            <div class="popup-overlay" id="popup">
                <div class="popup-card">
                    <button class="popup-close" onclick="closePopup()">&#x2715;</button>
                    <div class="popup-name" id="popup-name"></div>
                    <div class="popup-detail">
                        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span id="popup-address"></span>
                    </div>
                    <div class="popup-detail">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span id="popup-status"></span>&nbsp;<span id="popup-hours" style="color:#888;"></span>
                    </div>
                    <hr class="popup-divider">
                    <button class="directions-btn" onclick="openDirections()">
                        Get directions with Google Maps
                    </button>
                </div>
            </div>

            <iframe id="map-frame"
                src="https://maps.google.com/maps?width=1000&height=800&hl=en&q=angeles%20city&t=&z=14&ie=UTF8&iwloc=B&output=embed"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        let currentDirectionsUrl = '';
        let allFacilities = [];
        let userLat = null, userLon = null;
        let activeType = 'All';

        // ── 1. Get user location on page load ──────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            if (!navigator.geolocation) {
                document.getElementById('station-list').innerHTML =
                    '<div class="loading-msg">Geolocation not supported by your browser.</div>';
                return;
            }
            navigator.geolocation.getCurrentPosition(onLocation, onLocationError, {
                enableHighAccuracy: true, timeout: 10000
            });
        });

        function onLocation(pos) {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            // Re-center map on user
            document.getElementById('map-frame').src =
                `https://maps.google.com/maps?width=1000&height=800&hl=en&q=${userLat},${userLon}&t=&z=14&ie=UTF8&iwloc=B&output=embed`;
            const qs = new URLSearchParams(window.location.search).get('search');
            if (qs) document.getElementById('searchInput').value = qs;
            loadFacilities();
        }

        function onLocationError(err) {
            document.getElementById('station-list').innerHTML =
                '<div class="loading-msg">Could not get your location. Please allow location access and reload.</div>';
        }

        // ── 2. Fetch from backend ──────────────────────────────────────
        function loadFacilities() {
            const list = document.getElementById('station-list');
            list.innerHTML = '<div class="loading-msg">Loading nearby facilities…</div>';

            const formData = new FormData();
            formData.append('latitude',  userLat);
            formData.append('longitude', userLon);
            formData.append('type',      activeType);

            fetch('php/get_facilities.php', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(data => {
                    allFacilities = data;
                    renderCards(data);
                })
                .catch(() => {
                    list.innerHTML = '<div class="loading-msg">Failed to load facilities.</div>';
                });
            }

        // ── 3. Render cards ───────────────────────────────────────────
        function renderCards(facilities) {
            const list = document.getElementById('station-list');
            if (!facilities.length) {
                list.innerHTML = '<div class="loading-msg">No facilities found nearby.</div>';
                return;
            }
            list.innerHTML = facilities.map(f => {
                const isOpen   = isOpenNow(f.opening_hours);
                const statusLabel = isOpen ? 'Open now' : 'Closed';
                const statusClass = isOpen ? 'status-open' : 'status-closed';
                const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(f.name + ' ' + f.address)}`;
                // Encode facility data as JSON for the onclick
                const data = encodeURIComponent(JSON.stringify({
                    name: f.name, address: f.address,
                    status: statusLabel, hours: f.opening_hours || '',
                    mapsUrl
                }));
                return `
                <div class="station-card" onclick='showPopupFromData("${data}")'>
                    <div class="station-card-top">
                        <div class="station-name">${f.name}</div>
                        <div class="info-btn" onclick='event.stopPropagation(); showPopupFromData("${data}")'>i</div>
                    </div>
                    <div class="station-meta">
                        <span class="${statusClass}">${statusLabel}</span>
                        <span class="meta-text">${f.distance} km</span>
                        <span class="meta-text">${f.opening_hours || ''}</span>
                    </div>
                    <div class="station-desc">${f.description || f.type}</div>
                </div>`;
            }).join('');
        }

        // ── 4. Simple open/closed check ───────────────────────────────
        // Expects format like "08:00 AM – 06:00 PM"
        function isOpenNow(hours) {
            if (!hours) return false;
            if (hours.toLowerCase().includes('24')) return true; // handles "Open 24 hours"
            try {
                // handles both "–" and "-" as separator
                const parts = hours.split(/[–-]/).map(s => s.trim());
                if (parts.length < 2) return false;
                const toMin = str => {
                    str = str.trim();
                    const period = str.includes('PM') ? 'PM' : 'AM';
                    const timePart = str.replace('AM','').replace('PM','').trim();
                    let [h, m] = timePart.includes(':')
                        ? timePart.split(':').map(Number)
                        : [parseInt(timePart), 0];
                    if (period === 'PM' && h !== 12) h += 12;
                    if (period === 'AM' && h === 12) h = 0;
                    return h * 60 + m;
                };
                const now = new Date();
                const cur = now.getHours() * 60 + now.getMinutes();
                return cur >= toMin(parts[0]) && cur <= toMin(parts[1]);
            } catch { return false; }
        }

        // ── 5. Popup ──────────────────────────────────────────────────
        function showPopupFromData(encoded) {
            const f = JSON.parse(decodeURIComponent(encoded));
            showPopup(f.name, f.address, f.status, f.hours, f.mapsUrl);
        }

        function showPopup(name, address, status, hours, mapsUrl) {
            document.getElementById('popup-name').textContent    = name;
            document.getElementById('popup-address').textContent = address;
            const statusEl = document.getElementById('popup-status');
            statusEl.textContent = status;
            statusEl.className   = status === 'Open now' ? 'popup-status-open' : 'popup-status-closed';
            document.getElementById('popup-hours').textContent   = hours;
            currentDirectionsUrl = mapsUrl;
            document.getElementById('popup').classList.add('visible');
        }

        function closePopup() {
            document.getElementById('popup').classList.remove('visible');
        }

        function openDirections() {
            window.open(currentDirectionsUrl, '_blank');
        }

        // ── 6. Filter chips ───────────────────────────────────────────
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                activeType = chip.dataset.type;
                if (userLat !== null) loadFacilities();
            });
        });

        // ── 7. Search bar (client-side filter) ───────────────────────
        function filterCards() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFacilities.filter(f =>
                f.name.toLowerCase().includes(q) ||
                (f.address || '').toLowerCase().includes(q)
            );
            renderCards(filtered);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Page</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* Reset default styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* Page bg */
body {
  background: #F4F1E6;
}

/* sidebar contents */
.container {
  display: flex;
  height: 100vh;
}

/* styling */
.sidebar {
  width: 220px;
  padding: 20px;
  border-right: 1px solid #ccc;
}

/* Logo */
.logo {
  width: 185px;
  margin-bottom: 20px;
}

/* menu items */
.menu-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Active menu */
.menu-item.active {
  background: #AFC4D6;
}

/* Hover */
.menu-item:hover {
  background: #ddd;
}


.main {
  flex: 1;
  padding: 20px;
}

/*Right Top header  */
.header {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

/* Prof card container */
.card {
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  display: flex;
  gap: 30px;
}

/* Left side (form) */
.form-section {
  flex: 2;
}

/* Each in row */
.form-group {
  display: flex;
  align-items: center;
  margin-bottom: 15px;
}

/* Labels */
.form-group label {
  width: 140px;
  font-size: 14px;
}

/* Input */
.form-group input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

/* Gen btn */
.gender {
  display: flex;
  gap: 10px;
}

.gender label {
  border: 1px solid #ccc;
  padding: 8px 15px;
  border-radius: 20px;
  cursor: pointer;
}

/* Save btn */
.btn {
  margin-top: 20px;
  padding: 10px 20px;
  background: #4E8DC0;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* profile image */
.image-section {
  flex: 1;
  border-left: 1px solid #ccc;
  padding-left: 30px;
  text-align: center;
}

/* Profile pic */
.profile-pic {
  width: 120px;
  height: 120px;
  background: #ccc;
  border-radius: 50%;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

/* Up btn */
.upload-btn {
  margin-top: 15px;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  cursor: pointer;
  background: #f5f5f5;
}

/* Remove text */
.remove {
  margin-top: 10px;
  font-size: 12px;
  color: gray;
  cursor: pointer;
}

/* Pop bg */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  display: none;
  align-items: center;
  justify-content: center;
}

/* Pop box */
.popup-box {
  background: white;
  padding: 25px 40px;
  border-radius: 10px;
  text-align: center;
  animation: pop 0.3s ease;
}

/* Icon inside popup */
.popup-box i {
  font-size: 40px;
  color: #4E8DC0;
  margin-bottom: 10px;
}

/*  pop animation */
@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

</style>
</head>

<body>

<div class="container">

  
  <div class="sidebar">
    <img src="imgaes/userlogo.png" class="logo">

    <div class="menu-item active"><i class="fa-regular fa-user"></i> My Account</div>
    <div class="menu-item"><i class="fa-solid fa-location-dot"></i> My Addresses</div>
    <div class="menu-item"><i class="fa-solid fa-hand-holding-heart"></i> My Donations</div>
    <div class="menu-item"><i class="fa-solid fa-bug"></i> My Reports</div>
    <div class="menu-item"><i class="fa-regular fa-heart"></i> Saves</div>
    <div class="menu-item"><i class="fa-regular fa-bell"></i> Notifications</div>
    <div class="menu-item"><i class="fa-solid fa-right-from-bracket"></i> Log out</div>
  </div>


  <div class="main">

    
    <div class="header">
      <i class="fa-regular fa-bell"></i>
      <i class="fa-regular fa-heart"></i>
      <i class="fa-regular fa-user"></i>
      <span>User Profile</span>
    </div>

    
    <div class="card">

      
      <div class="form-section">
        <h2>Profile</h2>

        <div class="form-group">
          <label>Username</label>
          <input type="text" placeholder="Username">
        </div>

        <div class="form-group">
          <label>Name</label>
          <input type="text" placeholder="Name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Email">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" placeholder="+">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="gender">
            <label><input type="radio" name="gender"> Female</label>
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Other</label>
          </div>
        </div>

       
        <button class="btn" onclick="saveChanges()">SAVE CHANGES</button>
      </div>

     
      <div class="image-section">
        <div class="profile-pic">
          <i class="fa-regular fa-user"></i>
        </div>

        <div class="upload-btn">Select image</div>
        <div class="remove">Remove</div>
      </div>

    </div>

  </div>

</div>


<div id="popup" class="popup">
  <div class="popup-box">
    <i class="fa-solid fa-circle-check"></i>
    <p>Changes saved successfully!</p>
  </div>
</div>

<script>
// Save button 
function saveChanges() {
  const username = document.querySelector('input[placeholder="Username"]').value;
  const name = document.querySelector('input[placeholder="Name"]').value;
  const email = document.querySelector('input[placeholder="Email"]').value;
  const mobile = document.querySelector('input[placeholder="+"]').value;
  const gender = document.querySelector('input[name="gender"]:checked');

  const popup = document.getElementById("popup");
  const popupText = popup.querySelector("p");
  const popupIcon = popup.querySelector("i");

  // kapag walang laman
  if (username === "" || name === "" || email === "" || mobile === "" || !gender) {
    
    // popup to error
    popupText.textContent = "Please fill in all fields!";
    popupIcon.className = "fa-solid fa-circle-exclamation";
    popupIcon.style.color = "#DA8063"; // orange/red

  } else {
    
    // Success pop
    popupText.textContent = "Changes saved successfully!";
    popupIcon.className = "fa-solid fa-circle-check";
    popupIcon.style.color = "#4E8DC0"; 
  }

  
  popup.style.display = "flex";

  // Hide the pop display
  setTimeout(() => {
    popup.style.display = "none";
  }, 2000);
}
</script>

</body>
</html>

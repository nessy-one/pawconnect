<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawConnect – Missing Pets</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream:  #F4F1E6;
            --rust:   #DA8063;
            --blue:   #4E8DC0;
            --dark:   #012224;
            --muted:  #8A8686;
            --white:  #ffffff;
            --shadow: rgba(0,0,0,0.10);
        }

        body {
            background: var(--cream);
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .header {
            background: var(--rust);
            display: flex;
            align-items: center;
            padding: 10px 24px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .logo-circle {
            border-radius: 50%;
            background: #3b8fc4;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; overflow: hidden;
            width: 52px; height: 52px;
        }
        .logo-circle img { width: 52px; height: 52px; object-fit: cover; }

        .search { 
            flex: 2; 
            position: relative; 
            max-width: 80%; 
            margin: 0 auto; 
        }

        .search input {
            width: 100%;
            padding: 9px 44px 9px 18px;
            border-radius: 8px; border: none;
            background: var(--cream);
            font-family: 'Poppins', sans-serif;
            font-size: 14px; color: var(--muted);
            outline: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .search .search-icon {
            position: absolute; right: 14px; top: 50%;
            transform: translateY(-50%); pointer-events: none;
        }

        .nav { display: flex; align-items: center; gap: 20px; margin-left: auto; }
        .nav a { display: flex; align-items: center; text-decoration: none; transition: opacity 0.15s; }
        .nav a:hover { opacity: 0.75; }
        .nav svg { width: 24px; height: 24px; stroke: var(--dark); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── PAGE ── */
        .page-content { flex: 1; padding: 32px 24px 48px; max-width: 1400px; width: 100%; margin: 0 auto; }

        .page-title { text-align: center; font-size: clamp(22px, 4vw, 32px); font-weight: 700; color: var(--blue); margin-bottom: 28px; }

        /* ── TOOLBAR ── */
        .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }

        .category-tabs { display: flex; gap: 0; }
        .tab-btn {
            padding: 8px 24px;
            border: 1.5px solid #ccc; background: var(--white);
            font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            color: var(--dark); cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .tab-btn:first-child { border-radius: 8px 0 0 8px; }
        .tab-btn:last-child  { border-radius: 0 8px 8px 0; }
        .tab-btn.active { background: var(--blue); color: var(--white); border-color: var(--blue); }
        .tab-btn:not(.active):hover { background: #f0f0f0; }

        .btn-report {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 22px;
            background: var(--rust); color: var(--white);
            border: none; border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s, transform 0.12s;
            box-shadow: 0 2px 6px rgba(218,128,99,0.35);
        }
        .btn-report:hover  { filter: brightness(1.08); transform: translateY(-1px); }
        .btn-report:active { transform: translateY(0); }
        .btn-report svg { width: 16px; height: 16px; stroke: var(--white); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── PET GRID ── */
        .pet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

        .pet-card {
            background: var(--white); border-radius: 14px; overflow: hidden;
            box-shadow: 0 2px 10px var(--shadow);
            transition: transform 0.18s, box-shadow 0.18s; cursor: pointer;
        }
        .pet-card:hover { transform: translateY(-4px); box-shadow: 0 8px 22px rgba(0,0,0,0.13); }

        .pet-card-img-wrap { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; background: #e8e4d8; }
        .pet-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
        .pet-card:hover .pet-card-img-wrap img { transform: scale(1.04); }

        .pet-type-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,34,36,0.65); color: #fff;
            font-size: 11px; font-weight: 600;
            padding: 3px 9px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .card-body { padding: 12px 14px 14px; }
        .card-name { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
        .card-detail {
            display: flex; align-items: flex-start; gap: 6px;
            font-size: 12.5px; color: var(--muted); margin-bottom: 4px; line-height: 1.4;
        }
        .card-detail svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 1px; stroke: var(--rust); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .grid-message { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
        .pet-card.hidden { display: none; }

        /* ── FOOTER ── */
        footer { background: var(--rust); color: var(--white); text-align: center; padding: 28px 20px; }
        footer h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        footer p  { font-size: 14px; opacity: 0.9; }

        /* ── MODAL ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(1,34,36,0.55); z-index: 200;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--cream); border-radius: 16px;
            width: 100%; max-width: 520px;
            max-height: 92vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: slideUp 0.22s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            background: var(--rust); color: var(--white);
            padding: 18px 22px; border-radius: 16px 16px 0 0;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1;
        }
        .modal-header h2 { font-size: 18px; font-weight: 700; }
        .modal-close {
            background: none; border: none; color: var(--white);
            font-size: 24px; cursor: pointer; line-height: 1; opacity: 0.85;
            transition: opacity 0.15s;
        }
        .modal-close:hover { opacity: 1; }

        .modal-body { padding: 22px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 5px; }
        .form-group input,
        .form-group select {
            width: 100%; padding: 9px 13px;
            border: 1.5px solid #d4d0c8; border-radius: 8px;
            background: var(--white);
            font-family: 'Poppins', sans-serif; font-size: 13.5px; color: var(--dark);
            outline: none; transition: border-color 0.15s;
        }
        .form-group input:focus,
        .form-group select:focus { border-color: var(--blue); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* ── IMAGE UPLOAD ── */
        .upload-area {
            border: 2px dashed #d4d0c8;
            border-radius: 10px;
            background: var(--white);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .upload-area:hover,
        .upload-area.dragover { border-color: var(--blue); background: #f0f6fb; }

        .upload-area input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }

        .upload-icon svg { width: 36px; height: 36px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 8px; }
        .upload-text { font-size: 13px; color: var(--muted); }
        .upload-text strong { color: var(--blue); }
        .upload-hint { font-size: 11px; color: #bbb; margin-top: 4px; }

        .upload-preview { display: none; position: relative; margin-top: 10px; }
        .upload-preview img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; display: block; }
        .preview-remove {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0,0,0,0.55); color: #fff;
            border: none; border-radius: 50%;
            width: 26px; height: 26px; cursor: pointer;
            font-size: 14px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .preview-remove:hover { background: rgba(218,128,99,0.9); }

        .form-submit {
            width: 100%; padding: 11px;
            background: var(--rust); color: var(--white);
            border: none; border-radius: 8px;
            font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600;
            cursor: pointer; margin-top: 6px; transition: filter 0.15s;
        }
        .form-submit:hover { filter: brightness(1.08); }
        .form-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── RESPONSIVE ── */
        @media (max-width: 1100px) { .pet-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .header { padding: 10px 14px; gap: 10px; }
            .logo-circle { width: 40px; height: 40px; }
            .logo-circle img { width: 40px; height: 40px; }
            .nav { gap: 14px; }
            .page-content { padding: 20px 14px 36px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .category-tabs { justify-content: center; }
            .tab-btn { padding: 8px 18px; font-size: 13px; }
            .btn-report { justify-content: center; width: 100%; }
            .pet-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            .form-row { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .pet-grid { grid-template-columns: 1fr; }
            .nav svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a href="dashboard.html">
            <div class="logo-circle">
                <img src="image/logo.png" alt="PawConnect Logo">
            </div>
        </a>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search pets…" oninput="handleSearch()">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
                     stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
        </div>
        <div class="nav">
            <a href="userprof.html" title="Profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a href="save.html" title="Favourites">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
            <a href="notifications.html" title="Notifications">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="page-content">
        <h1 class="page-title">Missing Pets</h1>

        <div class="toolbar">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">ALL</button>
                <button class="tab-btn" onclick="filterCategory('cat', this)">CATS</button>
                <button class="tab-btn" onclick="filterCategory('dog', this)">DOGS</button>
            </div>
            <button class="btn-report" onclick="openModal()">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Report Missing Pet
            </button>
        </div>

        <div class="pet-grid" id="petGrid">
            <div class="grid-message" id="gridLoader">Loading pets…</div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <h2>Want to report a missing animal?</h2>
        <p>Contact us at info@pawconnect.com</p>
    </footer>

    <!-- REPORT MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
        <div class="modal">
            <div class="modal-header">
                <h2>Report a Missing Pet</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="reportForm" onsubmit="submitReport(event)">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="petName">Pet Name *</label>
                            <input type="text" id="petName" name="name" required placeholder="e.g. Buddy">
                        </div>
                        <div class="form-group">
                            <label for="petType">Type *</label>
                            <select id="petType" name="pet_id" required>
                                <option value="">Select…</option>
                                <option value="1">Dog</option>
                                <option value="2">Cat</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="petBreed">Breed</label>
                        <input type="text" id="petBreed" name="breed" placeholder="e.g. Aspin">
                    </div>

                    <div class="form-group">
                        <label for="petPlace">Place Last Seen *</label>
                        <input type="text" id="petPlace" name="place" required placeholder="e.g. Barangay San Roque">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="petDate">Date Disappeared *</label>
                            <input type="date" id="petDate" name="date" required>
                        </div>
                        <div class="form-group">
                            <label for="petContact">Contact Number *</label>
                            <input type="tel" id="petContact" name="contact" required placeholder="09XX XXX XXXX">
                        </div>
                    </div>

                    <!-- IMAGE UPLOAD -->
                    <div class="form-group">
                        <label>Pet Photo</label>
                        <div class="upload-area" id="uploadArea"
                             ondragover="handleDragOver(event)"
                             ondragleave="handleDragLeave(event)"
                             ondrop="handleDrop(event)">
                            <input type="file" name="pet_image" id="petImage"
                                   accept="image/jpeg,image/png,image/webp"
                                   onchange="handleFileSelect(event)">
                            <div class="upload-icon">
                                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            </div>
                            <div class="upload-text"><strong>Click to upload</strong> or drag &amp; drop</div>
                            <div class="upload-hint">JPG, PNG or WEBP · max 5MB</div>
                        </div>
                        <div class="upload-preview" id="uploadPreview">
                            <img id="previewImg" src="" alt="Preview">
                            <button type="button" class="preview-remove" onclick="removeImage()" title="Remove">×</button>
                        </div>
                    </div>

                    <button type="submit" class="form-submit" id="submitBtn">Submit Report</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        /* ── ICONS ── */
        const icons = {
            pin:   `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
            cal:   `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
            phone: `<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.81A16 16 0 0 0 16 16.09l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
            tag:   `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`
        };

        const typeMap  = { '1': 'dog', '2': 'cat' };
        const labelMap = { '1': 'Dog', '2': 'Cat' };

        /* ── BUILD CARD ── */
        function buildCard(p) {
            const type    = typeMap[String(p.pet_id)]  || 'other';
            const label   = labelMap[String(p.pet_id)] || 'Pet';
            // Use uploaded image if exists, otherwise placeholder
            const imgSrc  = p.image ? p.image : 'miss/placeholder.png';
            const breed   = p.breed   || 'Unknown breed';
            const place   = p.place   || '—';
            const date    = p.date    || '—';
            const contact = p.contact || '—';

            const card = document.createElement('div');
            card.className    = 'pet-card';
            card.dataset.type = type;
            card.dataset.name = p.name.toLowerCase();

            card.innerHTML = `
                <div class="pet-card-img-wrap">
                    <img src="${imgSrc}" alt="${p.name}" onerror="this.src='miss/placeholder.png'">
                    <span class="pet-type-badge">${label}</span>
                </div>
                <div class="card-body">
                    <div class="card-name">${p.name}</div>
                    <div class="card-detail">${icons.tag}   ${breed}</div>
                    <div class="card-detail">${icons.pin}   ${place}</div>
                    <div class="card-detail">${icons.cal}   ${date}</div>
                    <div class="card-detail">${icons.phone} ${contact}</div>
                </div>`;
            return card;
        }

        /* ── LOAD PETS ── */
        async function loadPets() {
            const grid = document.getElementById('petGrid');
            try {
                const res  = await fetch('php/missing.php?action=list');

                // Check if response is ok before parsing
                if (!res.ok) throw new Error('Server returned ' + res.status);

                const text = await res.text();

                // Try to parse JSON; if it fails, show the raw error
                let pets;
                try {
                    pets = JSON.parse(text);
                } catch(e) {
                    grid.innerHTML = `<div class="grid-message">PHP error — check console.</div>`;
                    console.error('Raw PHP response:', text);
                    return;
                }

                grid.innerHTML = '';

                if (!Array.isArray(pets) || pets.length === 0) {
                    grid.innerHTML = '<div class="grid-message">No missing pets reported yet.</div>';
                    return;
                }

                pets.forEach(p => grid.appendChild(buildCard(p)));
                applyFilters();
            } catch (err) {
                grid.innerHTML = '<div class="grid-message">Could not load data. Please refresh.</div>';
                console.error(err);
            }
        }

        /* ── FILTERS ── */
        let activeType  = 'all';
        let searchQuery = '';

        function filterCategory(type, btn) {
            activeType = type;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            applyFilters();
        }

        function applyFilters() {
            const cards = document.querySelectorAll('.pet-card');
            let visible = 0;
            cards.forEach(card => {
                const typeMatch = activeType === 'all' || card.dataset.type === activeType;
                const nameMatch = card.dataset.name.includes(searchQuery) ||
                                  card.querySelector('.card-name').textContent.toLowerCase().includes(searchQuery);
                if (typeMatch && nameMatch) { card.classList.remove('hidden'); visible++; }
                else                        { card.classList.add('hidden'); }
            });
            let empty = document.getElementById('emptyState');
            if (visible === 0 && cards.length > 0) {
                if (!empty) {
                    empty = document.createElement('div');
                    empty.id = 'emptyState'; empty.className = 'grid-message';
                    empty.textContent = 'No pets match your search.';
                    document.getElementById('petGrid').appendChild(empty);
                }
            } else if (empty) { empty.remove(); }
        }

        /* ── MODAL ── */
        function openModal()  { document.getElementById('modalOverlay').classList.add('open'); }
        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            removeImage(); // clear preview when modal closes
        }
        function handleOverlayClick(e) { if (e.target === e.currentTarget) closeModal(); }

        /* ── IMAGE UPLOAD UI ── */
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) showPreview(file);
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        }

        function handleDragLeave() {
            document.getElementById('uploadArea').classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                // Assign to the file input so FormData picks it up
                const dt = new DataTransfer();
                dt.items.add(file);
                document.getElementById('petImage').files = dt.files;
                showPreview(file);
            }
        }

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('uploadPreview').style.display = 'block';
                document.getElementById('uploadArea').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            document.getElementById('petImage').value = '';
            document.getElementById('previewImg').src = '';
            document.getElementById('uploadPreview').style.display = 'none';
            document.getElementById('uploadArea').style.display = 'block';
        }

        /* ── SUBMIT ── */
        async function submitReport(e) {
            e.preventDefault();
            const form = document.getElementById('reportForm');
            const btn  = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting…';

            try {
                const res  = await fetch('php/missing.php?action=report', {
                    method: 'POST',
                    body: new FormData(form)   // FormData handles file upload automatically
                });

                const text = await res.text();
                let json;
                try { json = JSON.parse(text); }
                catch(e) { console.error('PHP response:', text); throw new Error('Invalid server response'); }

                if (json.success) {
                    alert('Report submitted successfully!');
                    form.reset();
                    removeImage();
                    closeModal();
                    loadPets();
                } else {
                    alert('Error: ' + (json.message || 'Something went wrong.'));
                }
            } catch (err) {
                console.error(err);
                alert('Could not connect to the server. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Report';
            }
        }

        /* ── INIT ── */
        loadPets();
    </script>
</body>
</html>

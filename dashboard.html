<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F4F1E6;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        /* ── HEADER ─────────────────────────────────────────────── */
        .header {
            background-color: #DA8063;
            display: flex;
            align-items: center;
            padding: 10px 24px;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .logo-circle {
            border-radius: 50%;
            background-color: #3b8fc4;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .logo-circle img {
            width: 52px;
            height: 52px;
            object-fit: cover;
        }

        /* ── SEARCH BAR ─────────────────────────────────────────────── */
        .search {
            flex: 2;
            position: relative;
            max-width: 80%;
            margin: 0 auto;
        }

        .search input {
            width: 100%;
            padding: 9px 44px 9px 18px;
            border-radius: 8px;
            border: none;
            background: #F4F1E6;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: #8A8686;
            outline: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .search input::placeholder {
            color: #8A8686;
        }

        .search .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8A8686;
            font-size: 16px;
            pointer-events: none;
        }

        /* ── NAVIGATION ─────────────────────────────────────────────── */
        .nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.15s;
        }

        .nav a:hover { 
            opacity: 0.75; 
            transform: scale(1.1);
        }

        .nav svg {
            width: 24px;
            height: 24px;
            stroke: #012224;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .content {
            max-width: 90%;
            margin: 0 auto;
        }

        .banner {
            width: 100%;
            margin-top: 30px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* QUICK ACTION BUTTONS */
        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 36px;
            gap: 50px;
        }

        .buttons img {
            width: 150px;
            height: 130px;
            display: block;
        }

        .btn-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s, box-shadow 0.18s;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-card:hover {
            transform: translateY(-4px);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
        }

        .btn-card img {
            width: 140px;
            height: 120px;
            object-fit: contain;
            display: block;
        }

        /* MAP SECTION */
        .map-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .map-wrapper h2 {
            font-size: 17px;
            font-weight: 600;
            color: #2a2a2a;
        }

        .map-link {
            display: block;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            margin-bottom: 30px;
            text-decoration: none;
            transition: box-shadow 0.2s;
        }

        .map-link:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .map-link iframe {
            width: 100%;
            height: 400px;
            border: none;
            display: block;
            pointer-events: none;
        }

         /* ── HAMBURGER (mobile) ── */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
            margin-left: auto;
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #012224;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* ── MOBILE DRAWER ── */
        .mobile-nav {
            display: none;
            flex-direction: column;
            background: #DA8063;
            padding: 12px 24px 16px;
            gap: 16px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .mobile-nav.open { display: flex; }

        .mobile-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #012224;
            font-size: 14px;
            font-weight: 500;
            transition: opacity .15s;
        }

        .mobile-nav a:hover { opacity: 0.75; }

        .mobile-nav svg {
            width: 20px;
            height: 20px;
            stroke: #012224;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        
        /* Responsive Design */
        /* Tablet */
        @media (max-width: 768px) {
            .header {
                padding: 10px 16px;
                gap: 12px;
            }
 
            .logo-circle { width: 42px; height: 42px; }
            .logo-circle img { width: 42px; height: 42px; }
 
            /* Hide desktop nav, show hamburger */
            .nav { display: none; }
            .hamburger { display: flex; }
 
            .search { max-width: 100%; }
 
            .content { width: 94%; }
 
            .banner { margin-top: 20px; margin-bottom: 20px; border-radius: 10px; }
 
            .btn-card img { width: 110px; height: 95px; }
 
            .buttons { gap: 14px; }
 
            .map-link iframe { height: 300px; }
        }
 
        /* Mobile */
        @media (max-width: 480px) {
            .header { padding: 8px 12px; gap: 10px; }
 
            .logo-circle { width: 38px; height: 38px; }
            .logo-circle img { width: 38px; height: 38px; }
 
            .search input { font-size: 13px; padding: 8px 36px 8px 14px; }
 
            .content { width: 96%; }
 
            .banner { border-radius: 8px; margin-top: 16px; margin-bottom: 16px; }
 
            /* 3-column grid for action buttons */
            .buttons {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                justify-items: center;
            }
 
            /* Center the 5th card if it's alone on the last row */
            .btn-card:last-child:nth-child(3n+1) {
                grid-column: 2;
            }
 
            .btn-card img { width: 84px; height: 72px; }
 
            .map-link iframe { height: 240px; }
 
            .map-wrapper h2 { font-size: 15px; }
        }
 
        /* Very small screens */
        @media (max-width: 360px) {
            .btn-card img { width: 72px; height: 62px; }
            .buttons { gap: 8px; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <!-- Logo -->
        <a href="dashboard.html">
            <div class="logo-circle">
                <img src="image/logo.png" alt="PawConnect Logo">
            </div>
        </a>

        <!-- Search -->
        <div class="search">
            <input type="text" placeholder="Search">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
        </div>

        <!-- Nav -->
        <div class="nav">
            <a href="userprof.html" title="Profile">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </a>
            <a href="save.html" title="Favourites">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </a>
            <a href="notifications.html" title="Notifications">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </a>

            <div class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <!-- Mobile nav drawer -->
    <div class="mobile-nav" id="mobileNav">
        <a href="userprof.html">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profile
        </a>
        <a href="save.html">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            Favourites
        </a>
        <a href="notifications.html">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Notifications
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <!-- BANNER IMAGE -->
        <div class="banner">
            <img src="image/pawconnect.png" alt="PawConnect Banner">
        </div>

        <!-- QUICK ACTION BUTTONS -->
        <div class="buttons">
            <a class="btn-card" href="adopt.html">
                <img src="image/Adopt.png" alt="Adopt a pet">
            </a>

            <a class="btn-card" href="donate.html">
                <img src="image/Donate.png" alt="Donate now">
            </a>

            <a class="btn-card" href="facilities.html">
                <img src="image/Facilities.png" alt="Find facilities">
            </a>

            <a class="btn-card" href="products.html">
                <img src="image/Products.png" alt="Find products">
            </a>

            <a class="btn-card" href="missing.html">
                <img src="image/Missing.png" alt="Find missing animals">
            </a>
        </div>

        <!-- MAP -->
        <div class="map-wrapper">
            <h2>Find nearby services</h2>
            <a href="facilities.html" class="map-link">
                <iframe
                    src="https://maps.google.com/maps?width=1000&height=800&hl=en&q=angeles%20city&t=&z=12&ie=UTF8&iwloc=B&output=embed"
                    allowfullscreen
                    loading="lazy"
                    title="Map of Angeles City">
                </iframe>
            </a>
        </div>
    </div>
    <script>
        function toggleMenu() {
            const nav = document.getElementById('mobileNav');
            nav.classList.toggle('open');
        }
 
        // Close drawer when clicking outside
        document.addEventListener('click', function(e) {
            const nav = document.getElementById('mobileNav');
            const hamburger = document.getElementById('hamburger');
            if (!nav.contains(e.target) && !hamburger.contains(e.target)) {
                nav.classList.remove('open');
            }
        });
    </script>
</body>
</html>

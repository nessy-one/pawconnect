<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reports</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* Background */
body {
  background: #F4F1E6;
}

/* Layout */
.container {
  display: flex;
  height: 100vh;
}
.sidebar {
  width: 220px;
  padding: 20px;
  border-right: 1px solid #ccc;
}

/* Logo */
.logo-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background-color: #3b8fc4;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  margin-bottom: 20px;  
}

.logo-circle img {
  width: 60px;
  height: 60px;
  object-fit: cover;
}

/* menu items */
.menu-item {
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Active menu */
.menu-item.active {
  background: #AFC4D6;
}

/* Hover */
.menu-item:hover {
  background: #ddd;
}
.menu-item {
  text-decoration: none;
  color: black;
}
.main { 
  flex:1; 
  padding:20px; 
}
.header {
  display:flex;
  justify-content:flex-end;
  gap:15px;
  margin-bottom:20px;
}
.header a {
  color:black;
  text-decoration:none;
}

.card {
  background:white;
  padding:30px;border-radius:10px;
  text-align:center;
}

/* Top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Button */
.btn {
  background: #4E8DC0;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* Center content */
.pic {
  text-align: center;
  margin-top: 40px;
}

.pic img {
  height: 250px;
  width: auto;
  margin-bottom: 15px;
}
</style>
</head>

<body>
<div class="container">
  <div class="sidebar">
    <a href="dashboard.html">
      <div class="logo-circle">
          <img src="image/logo.png" alt="PawConnect Logo">
      </div>
    </a>

    <a href="userprof.html" class="menu-item">
      <i class="fa-regular fa-user"></i> My Account
    </a>

    <a href="addres.html" class="menu-item">
      <i class="fa-solid fa-location-dot"></i> My Addresses
    </a>

    <a href="donation.html" class="menu-item ">
      <i class="fa-solid fa-hand-holding-heart"></i> My Donations
    </a>

    <a href="report.html" class="menu-item active">
      <i class="fa-solid fa-bug"></i> My Reports
    </a>

    <a href="save.html" class="menu-item">
      <i class="fa-regular fa-heart"></i> Saves
    </a>

    <a href="notifications.html" class="menu-item">
      <i class="fa-regular fa-bell"></i> Notifications
    </a>

    <a href="login.html" class="menu-item">
      <i class="fa-solid fa-right-from-bracket"></i> Log out
    </a>
  </div>

<div class="main">

<div class="header">
  <a href="notification.html"><i class="fa-regular fa-bell"></i></a>
  <a href="save.html"><i class="fa-regular fa-heart"></i></a>
  <a href="userprof.html"><i class="fa-regular fa-user"></i></a>
  <span>User profile</span>
</div>

<div class="card">
  <div class="top-bar">
    <h2>My Reports</h2>
    <button class="btn">REPORT NOW</button>
  </div>

  <div class="pic">
    <img src="image/cat.png" alt="No reports">
    <p>You will be able to see all the missing/found animals you reported here.</p>
  </div>

</div>

</div>
</div>
</body>
</html>
